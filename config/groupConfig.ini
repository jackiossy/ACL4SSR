;节点重命名：按订阅顺序给不同机场加来源前缀
;说明：GROUPID 从 0 开始，对应 OpenClash 传给 Subconverter 的第 1、2、3... 个订阅 URL。
;如果你的订阅顺序是：花云 | 牛逼，则下面两行会生成：花-香港01、牛-香港01。
rename_node=!!GROUPID=0!!^(?!花-)(.+)$@花-$1
rename_node=!!GROUPID=1!!^(?!牛-)(.+)$@牛-$1

